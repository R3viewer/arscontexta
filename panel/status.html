<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vault Status</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: transparent;
      }
      #root {
        padding: 8px 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 0;
        box-sizing: border-box;
      }
      .ac-status-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        flex-wrap: wrap;
      }
      .ac-status-badges {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }
      .ac-status-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./status.js"></script>
  </body>
</html>
